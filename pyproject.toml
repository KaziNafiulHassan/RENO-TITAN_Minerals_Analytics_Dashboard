[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reno-titan-intelligence-platform"
version = "0.1.0"
description = "Critical Minerals Supply Chain Analytics & Visualization"
requires-python = ">=3.11"
dependencies = [
    # Web framework & serving
    "streamlit>=1.53.1",
    "fastapi>=0.128.5",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "uvicorn>=0.40.0",
    "gunicorn>=23.0.0",
    "starlette>=0.52.1",
    # Data processing
    "pandas>=2.0.3",
    "numpy>=2.4.2",
    "scipy>=1.17.0",
    "scikit-learn>=1.8.0",
    "pyarrow>=22.0.0",
    "networkx>=3.6.1",
    # Visualization
    "altair>=6.0.0",
    "matplotlib>=3.10.8",
    "pydeck>=0.9.1",
    "narwhals>=2.16.0",
    "plotly>=5.0.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.15.0",
    # Database & ORM
    "sqlalchemy>=2.0.46",
    "alembic>=1.18.3",
    # ML & experiment tracking
    "mlflow>=3.9.0",
    "skops>=0.13.0",
    # Observability
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-proto>=1.39.1",
    "opentelemetry-semantic-conventions>=0.60b1",
    # Supabase
    "supabase>=2.0.0",
    # Configuration & environment
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "toml>=0.10.2",
    # HTTP & auth
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "google-auth>=2.48.0",
    "cryptography>=46.0.0",
    # Validation
    "pydantic>=2.12.5",
    # PDF & file handling
    "pillow>=12.1.0",
    "pypdf>=6.7.0",
    "PyPDF2>=3.0.1",
    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2025.2",
    "tzdata>=2025.3",
    "click>=8.3.1",
    "tenacity>=9.1.2",
    "tqdm>=4.67.0",
    "prettytable>=3.17.0",
    "joblib>=1.5.3",
    "cloudpickle>=3.1.2",
    "watchdog>=6.0.0",
    "gitpython>=3.1.46",
    "huey>=2.6.0",
    "databricks-sdk>=0.85.0",
    "graphene>=3.4.3",
    "docker>=7.1.0",
    "ruamel.yaml>=0.18.0",
    "protobuf>=6.33.5",
    "cachetools>=6.2.6",
]

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["app", "etl"]
